    <h1>Consulta tu horario</h1>

    <form>

        <select>
            <option>Ruta 1 - Campus a Centro</option>
            <option>Ruta 2 - Campus a Terminal</option>
            <option>Ruta 3 - Campus a Mercado</option>

        <label>Día:</label>

            <option>Lunes</option>
            <option>Martes</option>
            <option>Miércoles</option>
            <option>Jueves</option>
            <option>Viernes</option>
        </select>

    <p><strong>Ruta 1 - Campus - Centro:</strong> Sale a las 06:30 y llega a las 07:15.</p>
